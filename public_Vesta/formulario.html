<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Archivos Vesta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Fredoka:wght@300..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/formulario.css">
</head>
<body>
    <nav>
        <h1>VESTA</h1>
        <img src="" alt="characterVesta">
    </nav>
    <form method="post" action="/formularioVesta" enctype="multipart/form-data">
        <label for="titleVesta">Titulo de la imagen: </label>
        <input type="text" name="titleVesta" id="titleVesta" required>
        <label for="imageVesta" class="secondLabel">Selecciona una Imagen</label>
        <input type="file" name="imageVesta" id="imageVesta" required>
        <button type="submit" class="submitBtn">enviar</button>
    </form>
</body>
</html>
